name: Mobile - Android build & upload

# Handmatig gestart — zelfde reden als mobile-ios.yml: een upload naar
# Google Play mag nooit een bijeffect van een gewone push zijn. Android
# heeft, anders dan iOS, GEEN Mac nodig — deze workflow draait daarom op
# een gewone ubuntu-runner en is dus het makkelijkste startpunt als je nog
# helemaal geen build-omgeving hebt opgezet.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane-lane"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Keystore + service-account-key komen uit secrets, nooit uit git
      # (zie android/app/keystore.properties.example en
      # docs/mobile-app/README.md). base64 omdat GitHub Secrets alleen
      # platte tekst opslaat, geen binaire bestanden.
      - name: Keystore + Google Play service-account-key uit secrets schrijven
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_BASE64: ${{ secrets.GOOGLE_PLAY_JSON_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "$GOOGLE_PLAY_JSON_KEY_BASE64" | base64 --decode > google-play-key.json
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$(pwd)/google-play-key.json" >> "$GITHUB_ENV"

      - name: Fastlane-lane draaien
        run: bundle exec fastlane android ${{ inputs.lane }}

      - name: Build-artefact bewaren (ter inzage, ook al is 'm al geüpload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ inputs.lane }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Geheimen van de runner opruimen
        if: always()
        run: rm -f android/app/release.keystore android/app/keystore.properties google-play-key.json
